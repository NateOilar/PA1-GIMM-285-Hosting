<!doctype html>
<html>

<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Game Devs & their Creations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
    <link rel='stylesheet' href='assets/css/style.css' />
</head>

<body>
    <div class='ribbon'></div>
    <div class="navBar px-3">
        <a href='insert.html' class="btn btn-secondary mt-3 back-btn">Add to the Table</a>
    </div>
    <h1>Game Devs & their Creations</h1>

    <hr />

    <div class="container">

        <div class='row mb-3'>
            <div class='col-2'>
                <label>Development Studio</label>
            </div>
            <div class='col-10'>
                <input id='studio' type='text' />
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-2'>
                <label>Country</label>
            </div>
            <div class='col-10'>
                <input id='country' type='text' />
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-2'>
                <label>Province</label>
            </div>
            <div class='col-10'>
                <input id='province' type='text' />
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-2'>
                <label>Game</label>
            </div>
            <div class='col-10'>
                <input id='game' type='text' />
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-2'>
                <label>Genre</label>
            </div>
            <div class='col-10'>
                <select id='genre'>
                    <option value=''>All Genres</option>
                    <option value='action'>Action</option>
                    <option value='adventure'>Adventure</option>
                    <option value='mmorpg'>MMORPG</option>
                    <option value='fps'>FPS</option>
                    <option value='strategy'>Strategy</option>
                    <option value='simulation'>Simulation</option>
                    <option value='sports-racing'>Sports/Racing</option>
                    <option value='puzzle'>Puzzle</option>
                    <option value='horror'>Horror</option>
                    <option value='platformer'>Platformer</option>
                </select>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-2'>
                <label>Art Style</label>
            </div>
            <div class='col-10'>
                <select id='art_style'>
                    <option value=''>All Art Styles</option>
                    <option value='realistic'>Realistic</option>
                    <option value='cartoon'>Cartoon</option>
                    <option value='pixelart'>Pixel Art</option>
                    <option value='anime'>Anime</option>
                    <option value='low-poly'>Low-Poly</option>
                </select>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-2'>
                <label>Limit of Rows</label>
            </div>
            <div class='col-10'>
                <input id='limit' type='text' />
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-12'>
                <button id='search'>Search!</button>
            </div>
        </div>

    </div>

    <hr />


    <div id="classes" class="overflow mt-5 mb-5 px-5">
        Devs & their Creations go here.
    </div>

    <script>
        const isEmpty = (obj) => Object.keys(obj).length === 0;

        document.getElementById('search').addEventListener('click', (event) => {
            const getParameters = {};

            //this is for a check box //

            // if (document.querySelector('#gimm:checked')) {
            //     getParameters.gimm = 0;
            // }

            // these are for all else //

            if (document.getElementById('studio').value.length !== 0) {
                getParameters.studio = document.getElementById('studio').value;
            }

            if (document.getElementById('country').value.length !== 0) {
                getParameters.country = document.getElementById('country').value;
            }

            if (document.getElementById('province').value.length !== 0) {
                getParameters.province = document.getElementById('province').value;
            }

            if (document.getElementById('game').value.length !== 0) {
                getParameters.game = document.getElementById('game').value;
            }

            if (document.getElementById('genre').value.length !== 0) {
                getParameters.genre = document.getElementById('genre').value;
            }

            if (document.getElementById('art_style').value.length !== 0) {
                getParameters.art_style = document.getElementById('art_style').value;
            }

            if (document.getElementById('limit').value.length !== 0) {
                getParameters.limit = document.getElementById('limit').value;
            }

            //Settings for FETCH API request
            let fetchSettings = {
                method: 'GET'
            };

            //Send FETCH API request
            fetch("/developer/" + (!isEmpty(getParameters) ? '?' + new URLSearchParams(getParameters) : ''), fetchSettings)
                .then((response) => {
                    return new Promise((resolve) => response.json()
                        .then((json) => resolve({
                            status: response.status,
                            json,
                        })
                        ));
                })
                //Logic to display errors on form 
                .then(({ status, json }) => {
                    if (status === 200) {
                        let displayTable = '<table>' +
                            '<thead>' +
                            '<tr>' +
                            '<th>Dev Studio</th>' +
                            '<th>Country</th>' +
                            '<th>Province</th>' +
                            '<th>Game</th>' +
                            '<th>Genre</th>' +
                            '<th>Art Style</th>' +
                            '<th>Edit</th>' +
                            '</tr>' +
                            '</thead>' +
                            '<tbody>';
                        if (typeof json.data !== 'undefined') {
                            for (row of json.data) {
                                displayTable += '<tr>' +
                                    '<td>' + row.name + '</td>' +
                                    '<td>' + row.country + '</td>' +
                                    '<td>' + row.province + '</td>' +
                                    '<td>' + row.game + '</td>' +
                                    '<td>' + row.genre + '</td>' +
                                    '<td>' + row.art_style + '</td>' +
                                    '<td><a href="edit.html?id=' + row.game_id + '">Edit</a></td>' +
                                    '</tr>';
                            }
                        }
                        displayTable += '</tbody></table>';
                        document.getElementById('classes').innerHTML = displayTable;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        });               
    </script>
</body>

</html>
